<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPOC — Mở hòm tài liệu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230e0f12'/%3E%3Crect x='22' y='34' width='56' height='44' rx='6' fill='%23e8b84b'/%3E%3Crect x='22' y='34' width='56' height='14' rx='6' fill='%23f0c669'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0c0f;
    --bg-case: #15171c;
    --bg-case-2: #1a1c22;
    --border: #262932;
    --border-light: #343843;
    --text: #eceef1;
    --text-dim: #8a8f9c;
    --accent: #e8b84b;
    --accent-dim: #8a6d28;
    --accent-glow: rgba(232, 184, 75, 0.18);
    --slot-w: 160px;
    --slot-gap: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(232, 184, 75, 0.06), transparent),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100%;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }

  .eyebrow {
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 8px;
    font-weight: 600;
  }

  h1 {
    font-size: 30px;
    font-weight: 700;
    margin: 0 0 8px;
    letter-spacing: -0.015em;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-dim);
    margin: 0 0 32px;
  }

  .case-box {
    background: linear-gradient(180deg, var(--bg-case-2), var(--bg-case));
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.03);
  }

  .reel-viewport {
    position: relative;
    height: 180px;
    overflow: hidden;
    border-radius: 10px;
    background: #08090b;
    border: 1px solid var(--border);
    box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.5);
  }

  .reel-viewport::before,
  .reel-viewport::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: 100px;
    z-index: 3;
    pointer-events: none;
  }
  .reel-viewport::before {
    left: 0;
    background: linear-gradient(90deg, #08090b 15%, transparent);
  }
  .reel-viewport::after {
    right: 0;
    background: linear-gradient(270deg, #08090b 15%, transparent);
  }

  .pointer {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--accent);
    transform: translateX(-50%);
    z-index: 4;
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .pointer::before, .pointer::after {
    content: "";
    position: absolute;
    left: 50%;
    width: 0;
    height: 0;
    transform: translateX(-50%);
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
  }
  .pointer::before { top: -1px; border-top: 9px solid var(--accent); }
  .pointer::after { bottom: -1px; border-bottom: 9px solid var(--accent); }

  .reel-track {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    display: flex;
    align-items: center;
    gap: var(--slot-gap);
    padding: 0 10px;
    will-change: transform;
  }

  .slot {
    flex: 0 0 var(--slot-w);
    width: var(--slot-w);
    height: 150px;
    background: linear-gradient(180deg, #1a1c22, #141519);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px;
    text-align: center;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }

  .slot .icon {
    width: 42px;
    height: 50px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    box-shadow: 0 4px 10px -4px rgba(0, 0, 0, 0.5);
  }
  .slot .icon.docx { background: linear-gradient(160deg, #3b6ef0, #1c4ed8); color: #e8efff; }
  .slot .icon.pdf { background: linear-gradient(160deg, #e0453a, #b8291f); color: #ffe9e6; }

  .slot .name {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .slot.winner {
    border-color: var(--accent);
    background: linear-gradient(180deg, #2a2412, #1d1a10);
    box-shadow: 0 0 24px var(--accent-glow);
  }
  .slot.winner .name { color: var(--text); font-weight: 600; }

  .slot.winner.celebrate {
    animation: winnerPulse 0.6s ease-out;
  }

  @keyframes winnerPulse {
    0% { transform: scale(1); }
    35% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  .controls {
    margin-top: 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  button#open-btn {
    appearance: none;
    border: none;
    background: linear-gradient(180deg, #f0c669, var(--accent));
    color: #241a05;
    font-size: 15px;
    font-weight: 700;
    padding: 14px 40px;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.2s ease, filter 0.15s ease;
    box-shadow: 0 8px 20px -6px var(--accent-glow);
    letter-spacing: 0.01em;
  }
  button#open-btn:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }
  button#open-btn:active:not(:disabled) { transform: scale(0.97); }
  button#open-btn:disabled {
    background: #2e2b22;
    color: #6b654f;
    cursor: not-allowed;
    box-shadow: none;
  }

  .status {
    font-size: 13px;
    color: var(--text-dim);
    min-height: 18px;
  }

  .result-panel {
    margin-top: 24px;
    background: linear-gradient(180deg, #1a1c22, #15171c);
    border: 1px solid var(--accent-dim);
    border-radius: 12px;
    padding: 20px 24px;
    display: none;
    align-items: center;
    gap: 16px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .result-panel.show { display: flex; }
  .result-panel.show.visible { opacity: 1; transform: translateY(0); }

  .result-panel .icon {
    width: 46px;
    height: 54px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    box-shadow: 0 4px 10px -4px rgba(0, 0, 0, 0.5);
  }
  .result-panel .icon.docx { background: linear-gradient(160deg, #3b6ef0, #1c4ed8); color: #e8efff; }
  .result-panel .icon.pdf { background: linear-gradient(160deg, #e0453a, #b8291f); color: #ffe9e6; }

  .result-info { flex: 1; min-width: 0; }
  .result-info .label {
    font-size: 12px;
    color: var(--text-dim);
    margin: 0 0 4px;
  }
  .result-info .filename {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  a.open-link {
    flex-shrink: 0;
    appearance: none;
    text-decoration: none;
    background: var(--accent);
    border: 1px solid var(--accent);
    color: #241a05;
    font-size: 13px;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 8px;
    transition: filter 0.15s ease;
  }
  a.open-link:hover { filter: brightness(1.08); }

  .error-text {
    color: #e8846b;
  }

  .locked-note {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .reel-track { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">SPOC</p>
  <h1>Mở hòm tài liệu</h1>
  <p class="subtitle">Quay để nhận ngẫu nhiên một tài liệu trong kho lưu trữ.</p>

  <div class="case-box">
    <div class="reel-viewport">
      <div class="pointer"></div>
      <div class="reel-track" id="reel-track"></div>
    </div>

    <div class="controls">
      <button id="open-btn" disabled>Đang tải...</button>
      <p class="status" id="status-text"></p>
    </div>

    <div class="result-panel" id="result-panel">
      <div class="icon" id="result-icon">PDF</div>
      <div class="result-info">
        <p class="label">Bạn nhận được</p>
        <p class="filename" id="result-filename"></p>
      </div>
      <a class="open-link" id="result-link" href="#" target="_blank" rel="noopener">Mở file</a>
    </div>
  </div>
</div>

<script>
  // ====== CẤU HÌNH — SỬA 2 DÒNG DƯỚI ĐÂY TRƯỚC KHI DÙNG ======
  const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbxqeSHkjGMUVpUYzWKnsk7epB4zV3VQD0wU3JxA9ZiT-ivc1pcnx5c8SFLuZZNevPz-/exec";
  const GAS_SECRET = "806f239e-0a9f-4e9a-8b07-88835bf8b98c4e990e1edbeb408d962c2ac669d75dff";
  // =============================================================

  const openBtn = document.getElementById("open-btn");
  const statusText = document.getElementById("status-text");
  const reelTrack = document.getElementById("reel-track");
  const reelViewport = document.querySelector(".reel-viewport");
  const resultPanel = document.getElementById("result-panel");
  const resultIcon = document.getElementById("result-icon");
  const resultFilename = document.getElementById("result-filename");
  const resultLink = document.getElementById("result-link");

  const SLOT_WIDTH = 160;
  const SLOT_GAP = 14;
  const SLOT_STEP = SLOT_WIDTH + SLOT_GAP;

  let isSpinning = false;
  let cachedItems = null;

  // ---------- Âm thanh (tạo bằng Web Audio API, không cần file ngoài) ----------
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        audioCtx = null;
      }
    }
    return audioCtx;
  }

  function playTick(volume) {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "square";
    osc.frequency.value = 1200;
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.05);
  }

  function playWinSound() {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const notes = [880, 1108, 1320];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      const startAt = ctx.currentTime + i * 0.09;
      gain.gain.setValueAtTime(0.0001, startAt);
      gain.gain.exponentialRampToValueAtTime(0.14, startAt + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, startAt + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(startAt);
      osc.stop(startAt + 0.4);
    });
  }

  // ---------- Tiện ích hiển thị ----------
  function extOf(name) {
    const lower = name.toLowerCase();
    if (lower.endsWith(".pdf")) return "pdf";
    if (lower.endsWith(".docx")) return "docx";
    return "docx";
  }

  function baseName(name) {
    return name.replace(/\.(docx|pdf)$/i, "");
  }

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  function buildSlot(name, isWinner) {
    const ext = extOf(name);
    const div = document.createElement("div");
    div.className = "slot" + (isWinner ? " winner" : "");
    div.innerHTML =
      '<div class="icon ' + ext + '">' + ext.toUpperCase() + '</div>' +
      '<div class="name">' + escapeHtml(baseName(name)) + '</div>';
    return div;
  }

  function setStatus(msg, isError) {
    statusText.textContent = msg;
    statusText.className = "status" + (isError ? " error-text" : "");
  }

  // Hiển thị dải tĩnh ban đầu (chưa quay) ngay khi tải xong danh sách
  function renderStaticReel(items) {
    reelTrack.innerHTML = "";
    reelTrack.style.transition = "none";
    reelTrack.style.transform = "translateX(0)";
    const REPEAT = 4;
    for (let r = 0; r < REPEAT; r++) {
      for (const it of items) {
        reelTrack.appendChild(buildSlot(it.name, false));
      }
    }
  }

  // ---------- Tải danh sách ngay khi vào trang ----------
  async function preloadList() {
    setStatus("Đang tải danh sách tài liệu...", false);
    try {
      const res = await fetch(GAS_ENDPOINT + "?action=list&token=" + encodeURIComponent(GAS_SECRET));
      const data = await res.json();
      if (data.error) {
        setStatus(data.error, true);
        return;
      }
      cachedItems = data.items;
      renderStaticReel(cachedItems);
      setStatus("Sẵn sàng. Bấm \"Mở hòm\" để quay.", false);
      isSpinning = false;
      openBtn.disabled = false;
      openBtn.textContent = "Mở hòm";
    } catch (e) {
      setStatus("Không kết nối được máy chủ. Tải lại trang để thử lại.", true);
    }
  }

  // ---------- Hiệu ứng quay ----------
  async function openCase() {
    if (isSpinning) return;
    isSpinning = true;

    openBtn.disabled = true;
    openBtn.textContent = "Đang quay...";
    resultPanel.classList.remove("show", "visible");
    setStatus("Đang quay...", false);

    let data;
    try {
      const res = await fetch(GAS_ENDPOINT + "?action=list&token=" + encodeURIComponent(GAS_SECRET));
      data = await res.json();
    } catch (e) {
      setStatus("Không kết nối được máy chủ. Thử lại sau.", true);
      openBtn.disabled = false;
      return;
    }

    if (data.error) {
      setStatus(data.error, true);
      openBtn.disabled = false;
      return;
    }

    const items = data.items;
    const winnerName = data.winnerName;
    const ticket = data.ticket;

    const REPEAT = 8;
    const sequence = [];
    for (let r = 0; r < REPEAT; r++) {
      for (const it of items) {
        sequence.push(it.name);
      }
    }
    const WINNER_INDEX = sequence.length - Math.floor(items.length / 2) - 3;
    sequence[WINNER_INDEX] = winnerName;

    reelTrack.innerHTML = "";
    reelTrack.style.transition = "none";
    reelTrack.style.transform = "translateX(0)";

    sequence.forEach((name, idx) => {
      reelTrack.appendChild(buildSlot(name, idx === WINNER_INDEX));
    });

    const viewportWidth = reelViewport.clientWidth;
    const targetOffset = (WINNER_INDEX * SLOT_STEP) + (SLOT_WIDTH / 2) - (viewportWidth / 2) + 10;

    // Phát tiếng tick thưa dần trong lúc quay, mô phỏng hiệu ứng giảm tốc
    const tickCount = 26;
    let elapsedTick = 0;
    for (let i = 0; i < tickCount; i++) {
      const progress = i / tickCount;
      const delay = (progress * progress) * 4200 + 60;
      elapsedTick = Math.max(elapsedTick, delay);
      setTimeout(() => playTick(0.05 * (1 - progress * 0.4)), delay);
    }

    requestAnimationFrame(() => {
      reelTrack.style.transition = "transform 4.3s cubic-bezier(0.08, 0.7, 0.1, 1)";
      reelTrack.style.transform = "translateX(-" + targetOffset + "px)";
    });

    reelTrack.addEventListener("transitionend", async function onDone() {
      reelTrack.removeEventListener("transitionend", onDone);

      const winnerSlot = reelTrack.querySelector(".slot.winner");
      if (winnerSlot) {
        winnerSlot.classList.add("celebrate");
      }
      playWinSound();

      setStatus("Đang xác nhận phần thưởng...", false);

      let reveal;
      try {
        const res2 = await fetch(GAS_ENDPOINT + "?action=reveal&ticket=" + encodeURIComponent(ticket) + "&token=" + encodeURIComponent(GAS_SECRET));
        reveal = await res2.json();
      } catch (e) {
        setStatus("Không lấy được link file. Thử lại.", true);
        isSpinning = false;
        openBtn.disabled = false;
        openBtn.textContent = "Mở hòm";
        return;
      }

      if (reveal.error) {
        setStatus(reveal.error, true);
        isSpinning = false;
        openBtn.disabled = false;
        openBtn.textContent = "Mở hòm";
        return;
      }

      const ext = extOf(reveal.name);
      resultIcon.textContent = ext.toUpperCase();
      resultIcon.className = "icon " + ext;
      resultFilename.textContent = reveal.name;
      resultLink.href = reveal.url;
      resultPanel.classList.add("show");
      requestAnimationFrame(() => resultPanel.classList.add("visible"));

      isSpinning = false;
      openBtn.disabled = false;
      openBtn.textContent = "Mở hòm lần nữa";
      setStatus("Mở hòm thành công.", false);
    }, { once: true });
  }

  openBtn.addEventListener("click", openCase);

  document.addEventListener("DOMContentLoaded", preloadList);
  if (document.readyState === "complete" || document.readyState === "interactive") {
    preloadList();
  }
</script>
</body>
</html>
